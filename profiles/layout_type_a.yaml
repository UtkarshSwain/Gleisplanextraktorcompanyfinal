# Layout Type A - Deutsche Bahn Standard Track Layout
# This is the current default configuration migrated to the profile system

name: "layout_type_a"
version: "1.0"
description: |
  Standard Deutsche Bahn track layout format.
  Features: 13 detection classes, German coordinate format (XX,XXX),
  Standard signal naming conventions (e.g., AA123), GKS elements.

# Model configuration
model_path: null  # Will use default model from UI selection
model_classes:
  - signal
  - gm_block
  - gks_festkodiert
  - gks_gesteuert
  - weichen_block
  - isolierstoß
  - haltepunkt
  - sverbinder
  - coordinate
  - prellblock
  - haltetafel
  - endeweichen
  - weichengruppeende

class_aliases:
  endeweichen: weichenende

# Class-specific configurations
classes:
  signal:
    confidence_threshold: 0.80
    nms_threshold: 0.32
    requires_ocr: true
    id_pattern: "^[A-ZÄÖÜ]{1,4}\\d{1,4}$"
    color: [255, 0, 0]

  gm_block:
    confidence_threshold: 0.22
    nms_threshold: 0.40
    requires_ocr: false
    fixed_text: "GM"
    color: [0, 255, 0]

  gks_festkodiert:
    confidence_threshold: 0.50
    nms_threshold: 0.38
    requires_ocr: true
    id_pattern: "^\\d{3,4}$"
    color: [0, 0, 255]

  gks_gesteuert:
    confidence_threshold: 0.70
    nms_threshold: 0.38
    requires_ocr: true
    id_pattern: "^\\d{3,4}$"
    color: [255, 128, 0]

  weichen_block:
    confidence_threshold: 0.42
    nms_threshold: 0.30
    requires_ocr: true
    color: [128, 0, 255]

  isolierstoß:
    confidence_threshold: 0.09
    nms_threshold: 0.40
    requires_ocr: false
    color: [255, 255, 0]

  haltepunkt:
    confidence_threshold: 0.32
    nms_threshold: 0.40
    requires_ocr: false
    color: [0, 255, 255]

  sverbinder:
    confidence_threshold: 0.50
    nms_threshold: 0.40
    requires_ocr: false
    color: [255, 0, 255]

  coordinate:
    confidence_threshold: 0.10
    nms_threshold: 0.25
    requires_ocr: true
    color: [128, 128, 128]

  prellblock:
    confidence_threshold: 0.22
    nms_threshold: 0.40
    requires_ocr: false
    fixed_text: "PB"
    color: [64, 64, 64]

  haltetafel:
    confidence_threshold: 0.38
    nms_threshold: 0.35
    requires_ocr: true
    color: [192, 192, 192]

  weichenende:
    confidence_threshold: 0.28
    nms_threshold: 0.40
    requires_ocr: true
    color: [255, 192, 203]

  weichengruppeende:
    confidence_threshold: 0.32
    nms_threshold: 0.40
    requires_ocr: true
    color: [173, 216, 230]

# Linking rules - spatial relationships between elements
linking_rules:
  signal:
    mode: below
  gm_block:
    mode: below
  gks_festkodiert:
    mode: either
  gks_gesteuert:
    mode: either
  weichen_block:
    mode: inside
    block: true
  isolierstoß:
    mode: above
    tilted_ok: true
  haltepunkt:
    mode: either
  sverbinder:
    mode: above
  weichenende:
    mode: either
    dx_multiplier: 3.0
    prefer_horizontal: true
  prellblock:
    mode: right_or_below
    dx_multiplier: 2.0
    prefer_horizontal: true
  haltetafel:
    mode: either
    dx_multiplier: 2.0
  weichengruppeende:
    mode: either
    dx_multiplier: 4.0
    prefer_horizontal: true
    search_left: true

# OCR configuration
ocr:
  engine: paddleocr
  denoise_strength: 4
  sharpen_amount: 1.3
  use_preprocessing: true
  use_adaptive_threshold: true
  use_morph_operations: true
  confidence_thresholds:
    signal: 0.50
    gks_gesteuert: 0.40
    gks_festkodiert: 0.40
    coordinate: 0.65
    default: 0.45
  cardinal_detection_padding:
    coordinate: 4
    signal: 4
    weichenende: 8
    haltetafel: 4
    prellblock: 4
    gks_gesteuert: 8
    gks_festkodiert: 8
    weichengruppeende: 4
    weichen_block: 2
  cardinal_expansion_factor:
    coordinate: [1.0, 1.0]
    signal: [1.0, 1.0]
    gks_gesteuert: [0.6, 0.6]
    gks_festkodiert: [0.6, 0.6]
    weichen_block: [1.1, 1.0]
  angular_detection_padding:
    coordinate: 4
    signal: 8
    weichenende: 4
    haltetafel: 4
    prellblock: 4
    gks_gesteuert: 6
    gks_festkodiert: 6
  angular_expansion_factor:
    coordinate: [1.0, 1.0]
    signal: [1.0, 1.05]
    gks_gesteuert: [0.75, 0.75]
    gks_festkodiert: [0.75, 0.75]

# Detection configuration
detection:
  tile_size: 2048
  overlap_pct: 40
  dpi: 500
  pred_imgsz: 1024
  tile_halo: 320
  use_tta: true
  tta_scales: [1.0]
  tta_flips: [0, 1]
  tta_min_votes: 1
  conf: 0.005
  iou: 0.35
  max_det: 1500
  agnostic_nms: false
  half: false

# Validation patterns
validation:
  coordinate_pattern: '^\s*([+-]?\d{1,3}[,\.]\d{3,4})\s*(?:(?:GI|Gl)\.?\s*([A-Za-z0-9./-]{1,6}))?\s*$'
  numeric_ok_classes:
    - gks_gesteuert
    - gks_festkodiert
    - weichen_block
    - prellblock
  id_patterns:
    signal: "^[A-ZÄÖÜ]{1,4}\\d{1,4}$"
    gks_gesteuert: "^\\d{3,4}$"
    gks_festkodiert: "^\\d{3,4}$"

# Layout detection fingerprints (for auto-detection)
detection_fingerprints:
  title_block_patterns:
    - "Deutsche Bahn"
    - "DB Netz"
    - "Gleisplan"
    - "km\\s*\\d+"
  coordinate_format: "XX,XXX"
  typical_dpi: 500
  color_scheme: "bw"
  expected_classes:
    - signal
    - coordinate
    - gks_gesteuert
    - weichen_block

# Metadata
metadata:
  author: "Gleisplanextraktor"
  created: "2024"
  railway_company: "Deutsche Bahn"
  document_standard: "DB Standard"
