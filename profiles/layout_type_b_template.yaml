# Layout Type B - TEMPLATE for New Track Layout Type
# Copy this file and customize for your specific layout type

name: "layout_type_b"
version: "1.0"
description: |
  Template for a new track layout type.

  INSTRUCTIONS:
  1. Analyze sample documents from this layout type
  2. Identify all visual elements that need detection
  3. Define classes, their visual characteristics, and confidence thresholds
  4. Define spatial relationships (linking rules) between elements
  5. Configure OCR parameters based on font/text style
  6. Train a new YOLO model or fine-tune existing one
  7. Add detection fingerprints for auto-detection

# =============================================================================
# STEP 1: MODEL CONFIGURATION
# =============================================================================
# Point to your trained YOLO model for this layout type

model_path: null  # e.g., "/path/to/layout_b_model.pt"

# Define all classes your model detects
# These should match the class names in your YOLO training data
model_classes:
  - element_type_1    # Example: main signals
  - element_type_2    # Example: secondary signals
  - element_type_3    # Example: kilometer markers
  - element_type_4    # Example: track numbers
  - text_label        # Example: text annotations
  # Add more classes as needed

# Aliases for class names (optional)
class_aliases: {}
  # old_name: new_name

# =============================================================================
# STEP 2: CLASS-SPECIFIC CONFIGURATIONS
# =============================================================================
# Configure each detection class with appropriate thresholds

classes:
  element_type_1:
    # Confidence threshold: How confident must YOLO be to accept detection?
    # Lower = more detections but more false positives
    # Higher = fewer detections but more accurate
    # Start at 0.5 and adjust based on validation results
    confidence_threshold: 0.5

    # NMS threshold: How much overlap allowed before suppressing duplicate?
    # Lower = more aggressive suppression
    # Higher = allows more overlapping boxes
    nms_threshold: 0.4

    # Does this element have text that needs OCR extraction?
    requires_ocr: true

    # If text is always the same (e.g., "STOP"), set it here
    fixed_text: null

    # Regex pattern to validate extracted text
    # null = no validation
    id_pattern: null  # e.g., "^[A-Z]{2}\\d{3}$"

    # Color for visualization (RGB)
    color: [255, 0, 0]

  element_type_2:
    confidence_threshold: 0.5
    nms_threshold: 0.4
    requires_ocr: true
    fixed_text: null
    id_pattern: null
    color: [0, 255, 0]

  element_type_3:
    confidence_threshold: 0.5
    nms_threshold: 0.4
    requires_ocr: true
    fixed_text: null
    id_pattern: null
    color: [0, 0, 255]

  element_type_4:
    confidence_threshold: 0.5
    nms_threshold: 0.4
    requires_ocr: false  # No text to extract
    fixed_text: null
    id_pattern: null
    color: [255, 255, 0]

  text_label:
    confidence_threshold: 0.3  # Text can be harder to detect
    nms_threshold: 0.25
    requires_ocr: true
    fixed_text: null
    id_pattern: null
    color: [128, 128, 128]

# =============================================================================
# STEP 3: LINKING RULES - SPATIAL RELATIONSHIPS
# =============================================================================
# Define how elements relate spatially to coordinate/text labels
#
# Modes:
#   - "below": Coordinate must be below the anchor
#   - "above": Coordinate must be above the anchor
#   - "either": Coordinate can be above or below
#   - "inside": Coordinate must be inside anchor's bounding box
#   - "right_or_below": Coordinate can be to the right or below
#
# Additional options:
#   - dx_multiplier: Search distance multiplier in X direction
#   - dy_multiplier: Search distance multiplier in Y direction
#   - prefer_horizontal: Prefer coordinates in horizontal direction
#   - search_left: Also search to the left
#   - tilted_ok: Allow tilted elements
#   - block: Element contains multiple coordinates (like weichen_block)

linking_rules:
  element_type_1:
    mode: below

  element_type_2:
    mode: either
    dx_multiplier: 1.5

  element_type_3:
    mode: right_or_below
    dx_multiplier: 2.0
    prefer_horizontal: true

  element_type_4:
    mode: inside
    block: true

# =============================================================================
# STEP 4: OCR CONFIGURATION
# =============================================================================
# Configure text recognition parameters based on the document's font/style

ocr:
  # OCR engine: "paddleocr" (recommended), "easyocr", or "tesseract"
  engine: paddleocr

  # Preprocessing parameters
  # Increase denoise_strength for noisy/low-quality scans
  denoise_strength: 4

  # Increase sharpen_amount for blurry text
  sharpen_amount: 1.3

  # Enable/disable preprocessing steps
  use_preprocessing: true
  use_adaptive_threshold: true
  use_morph_operations: true

  # OCR confidence thresholds per class
  # Lower values accept more text but may include errors
  confidence_thresholds:
    element_type_1: 0.5
    element_type_2: 0.5
    text_label: 0.4
    default: 0.45

  # Padding around detected elements for OCR (pixels)
  # Increase if text is being cut off
  cardinal_detection_padding:
    element_type_1: 4
    element_type_2: 4
    text_label: 8

  # Expansion factor for OCR region
  # Values > 1.0 expand the region, < 1.0 shrink it
  cardinal_expansion_factor:
    element_type_1: [1.0, 1.0]
    element_type_2: [1.0, 1.0]
    text_label: [1.2, 1.1]

  # Same for angular (rotated) text
  angular_detection_padding:
    element_type_1: 6
    element_type_2: 6
    text_label: 10

  angular_expansion_factor:
    element_type_1: [1.0, 1.05]
    element_type_2: [1.0, 1.05]
    text_label: [1.2, 1.15]

# =============================================================================
# STEP 5: DETECTION CONFIGURATION
# =============================================================================
# YOLO detection parameters - usually don't need to change unless
# you have very different document sizes or resolutions

detection:
  # Image tiling - for large documents
  tile_size: 2048       # Size of each tile
  overlap_pct: 40       # % overlap between tiles

  # Document resolution
  dpi: 500              # Adjust based on your scan quality

  # YOLO input size
  pred_imgsz: 1024      # Should match training imgsz

  # Context around tiles
  tile_halo: 320

  # Test-time augmentation (improves accuracy, slower)
  use_tta: true
  tta_scales: [1.0]
  tta_flips: [0, 1]
  tta_min_votes: 1

  # YOLO prediction parameters
  conf: 0.005           # Low initial conf (filtered by class thresholds)
  iou: 0.35             # NMS IoU threshold
  max_det: 1500         # Max detections per tile
  agnostic_nms: false
  half: false           # Set true for GPU with FP16 support

# =============================================================================
# STEP 6: VALIDATION PATTERNS
# =============================================================================
# Define patterns to validate extracted data

validation:
  # Regex pattern for coordinate text
  # Modify based on your coordinate format (e.g., "XX.XXX", "XX,XXX", "XXXX")
  coordinate_pattern: '^\s*\d{1,4}[,\.]\d{1,4}\s*$'

  # Classes where numeric-only text is acceptable
  numeric_ok_classes:
    - element_type_3
    - element_type_4

  # ID patterns for validation
  id_patterns:
    element_type_1: "^[A-Z]+\\d+$"  # e.g., "ABC123"
    element_type_2: "^\\d{4}$"      # e.g., "1234"

# =============================================================================
# STEP 7: AUTO-DETECTION FINGERPRINTS
# =============================================================================
# Define characteristics that identify this layout type

detection_fingerprints:
  # Text patterns found in title block or header
  title_block_patterns:
    - "Company Name"
    - "Document Type"
    - "Layout B Identifier"

  # Coordinate format used
  coordinate_format: "XX.XXX"  # or "XX,XXX", "XXXX", etc.

  # Typical DPI of source documents
  typical_dpi: 300

  # Color scheme: "bw", "color", "blueprint"
  color_scheme: "color"

  # Classes typically found in this layout
  expected_classes:
    - element_type_1
    - element_type_2
    - text_label

# =============================================================================
# STEP 8: METADATA
# =============================================================================

metadata:
  author: "Your Name"
  created: "2024"
  railway_company: "Railway Company Name"
  document_standard: "Company Standard XYZ"
  notes: |
    Any additional notes about this layout type.
    - Special handling requirements
    - Known issues or limitations
    - Training data sources
