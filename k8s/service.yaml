apiVersion: v1
kind: Service
metadata:
  name: gleisplan-api-service
  labels:
    app: gleisplan-api
spec:
  type: LoadBalancer  # Expose to outside world
  selector:
    app: gleisplan-api  # Connect to pods with this label
  ports:
  - port: 80  # External port (what you'll access)
    targetPort: 8000  # Container port (FastAPI runs on 8000)
    protocol: TCP
    name: http
