apiVersion: apps/v1
kind: Deployment
metadata:
  name: gleisplan-api
  labels:
    app: gleisplan-api
spec:
  replicas: 2  # Run 2 instances for high availability
  selector:
    matchLabels:
      app: gleisplan-api
  template:
    metadata:
      labels:
        app: gleisplan-api
    spec:
      containers:
      - name: api
        image: ghcr.io/utkarshswain/gleisplanextraktorcompanyfinal:feature-docker-deployment
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: YOLO_MODEL_PATH
          value: "/app/yolomodel/best.pt"
        # Volume mount for model
        volumeMounts:
        - name: model-storage
          mountPath: /app/yolomodel
        # Resource limits
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      # Volume for model (using hostPath for local testing)
      volumes:
      - name: model-storage
        hostPath:
          path: /run/desktop/mnt/host/d/MAsterarbeitprototypv1/project1/Gleisplanextraktorv3/yolomodel
          type: Directory
